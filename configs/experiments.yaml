# EventLapse Experiment Pipeline Configuration

# 1. Baseline Full N x F Matrix Capability Boundary Sweep
expt_1_matrix_sweep:
  enabled: true
  schema_mode: structured_trace
  input_mode: native_video
  prompt_condition: structured_trace

# 2. Frame Sampling Density Interventions
expt_2_frame_density_interventions:
  enabled: true
  input_modes: [native_video, frames_2fps, frames_8fps, frames_16fps]
  target_domains: [bounce_ball, blinking, state_machine]

# 3. Oracle Keyframe Evidence Interventions
expt_3_oracle_keyframe_evidence:
  enabled: true
  input_mode: oracle_evidence
  event_window_epsilon: 0.1 # seconds
  target_domains: [bounce_ball, blinking, state_machine]

# 4. Prompting & Reasoning Format Interventions
expt_4_prompting_and_thinking_modes:
  enabled: true
  conditions: [direct, structured_trace, multi_turn_verification, thinking, role_prompting]
  target_domains: [bounce_ball, blinking, state_machine]

# 5. MORSE Trace Diagnosis & Error Taxonomy
expt_5_trace_diagnosis:
  enabled: true
  schema_mode: structured_trace
  error_categories:
    - correct
    - missed_event
    - hallucinated_event
    - merged_events
    - temporally_displaced_event
    - misidentified_event
    - correct_trace_wrong_final_answer
    - incorrect_trace_accidental_correct
